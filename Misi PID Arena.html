<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misi PID Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0a0f1f;--s1:#111a33;--s2:#18244a;--ln:#ffffff18;--ink:#eef2ff;--mut:#9aa8d0;--a1:#7c5cff;--a2:#22d3ee;--gold:#fbbf24;--ok:#34d399;--bad:#fb7185;--g:linear-gradient(135deg,#7c5cff,#22d3ee)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f5ff;--s1:#ffffff;--s2:#eef1ff;--ln:#1b24501f;--ink:#141a3a;--mut:#5b6690}}
:root[data-theme="dark"]{--bg:#0a0f1f;--s1:#111a33;--s2:#18244a;--ln:#ffffff18;--ink:#eef2ff;--mut:#9aa8d0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(900px 500px at 10% -10%,#7c5cff33,transparent),radial-gradient(800px 500px at 100% 0,#22d3ee22,transparent),var(--bg) fixed}
#app{max-width:980px;margin:0 auto;padding:16px 16px 96px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.logo{width:38px;height:38px;border-radius:12px;background:var(--g);display:grid;place-items:center;font-size:1.2rem}
.top b{font-size:1.05rem}.sp{flex:1}.mut{color:var(--mut)}.sm{font-size:.82rem}.c{text-align:center}
.chip{background:var(--s2);border:1px solid var(--ln);border-radius:99px;padding:6px 12px;font-weight:700;font-size:.85rem;white-space:nowrap}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 8px 30px #0003}
h1{font-size:2rem;line-height:1.1;margin:.2em 0;font-weight:800}h2{font-size:1.25rem;margin:.2em 0 .6em;font-weight:800}h3{margin:.2em 0 .5em;font-size:1rem}
.grad{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 18px;font-weight:700;color:#fff;background:var(--g);transition:transform .12s,filter .12s}
button:hover{transform:translateY(-1px);filter:brightness(1.08)}button:active{transform:scale(.97)}button:disabled{opacity:.4;cursor:default;transform:none}
button.alt{background:var(--s2);color:var(--ink);border:1px solid var(--ln)}button.bad{background:#e11d48}button.sm{padding:6px 10px;font-size:.78rem;border-radius:9px}
input,textarea,select{font:inherit;width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--ln);background:var(--s2);color:var(--ink)}textarea{min-height:70px}
label{display:block;font-weight:700;font-size:.85rem;margin:10px 0 4px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.stat{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:14px}
.stat b{display:block;font-size:1.7rem;font-weight:800}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 40%);z-index:5}
.nav button{background:var(--s1);color:var(--mut);border:1px solid var(--ln);min-width:96px}.nav button.on{background:var(--g);color:#fff;border:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.tabs button{background:var(--s1);color:var(--mut);border:1px solid var(--ln)}.tabs button.on{background:var(--g);color:#fff;border:0}
.node{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--s1);color:var(--ink);border:1px solid var(--ln);margin:10px 0;padding:14px}
.node.lock{opacity:.45}.node .em{font-size:1.9rem;width:48px;height:48px;border-radius:14px;background:var(--s2);display:grid;place-items:center}.node.boss{border-color:var(--gold);box-shadow:0 0 24px #fbbf2433}
.stars{color:var(--gold);letter-spacing:2px}
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:800}.bar{height:10px;background:var(--s2);border-radius:9px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--g);border-radius:9px}
.q{font-size:1.15rem;font-weight:700;line-height:1.45}.tag{font-size:.78rem;color:var(--mut)}
.ic{display:inline-block;background:#fff;border-radius:12px;padding:6px;margin:8px 8px 0 0}.ic img{width:46px;height:46px;display:block}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;margin:8px 0;background:var(--s1);color:var(--ink);border:1px solid var(--ln);font-weight:600}
.opt b{background:var(--s2);border-radius:9px;min-width:30px;height:30px;display:grid;place-items:center}.opt:hover b{background:var(--a1);color:#fff}
.opt.ok{background:#059669;border-color:#6ee7b7;color:#fff;animation:pop .4s}.opt.no{background:#be123c;color:#fff;animation:shk .4s}.opt.off{opacity:.3}
@keyframes pop{50%{transform:scale(1.025)}}@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{border-left:4px solid var(--a2);background:var(--s2);border-radius:12px;padding:12px 14px;margin:12px 0}
.rw{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--s2);margin:6px 0}.rw.me{outline:2px solid var(--a1)}.rw .n{width:30px;text-align:center;font-weight:800}.rw .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb{height:9px;border-radius:9px;background:var(--s2);overflow:hidden}.mb i{display:block;height:100%;border-radius:9px}
.rings{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.ring{text-align:center;font-size:.78rem}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.86rem}td,th{padding:8px 10px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}th{color:var(--mut);font-weight:700}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#64748b;margin-right:6px}.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.ins{display:flex;gap:12px;padding:12px;border-radius:14px;background:var(--s2);margin:8px 0}.ins span{font-size:1.4rem}
.pt{position:fixed;top:-20px;font-size:1.6rem;animation:fall linear forwards;pointer-events:none;z-index:9}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.banner{background:var(--g);color:#fff;border-radius:14px;padding:10px 14px;font-weight:700;margin:8px 0}
@media(max-width:520px){h1{font-size:1.55rem}.q{font-size:1.02rem}.nav button{min-width:0;flex:1}}
</style></head><body><div id="app"><div class="card c">Memuat…</div></div>
<script>
const Q=[{"l":"C1","b":"Pendahuluan","ic":[],"s":"Ruang Murid yang disebut dalam modul adalah …","ok":"layanan sumber belajar di rumah.pendidikan.go.id","d":["aplikasi bawaan PID untuk menulis dan menggambar","fitur berbagi layar nirkabel antarperangkat","ruangan khusus untuk menyimpan perangkat PID","kode QR penyimpan hasil asesmen murid"],"e":"Ruang Murid adalah Layanan Sumber Belajar yang juga memuat materi pendidikan khusus."},{"l":"C2","b":"Pendahuluan","ic":[],"s":"Pernyataan yang paling tepat menjelaskan AAC (komunikasi augmentatif dan alternatif) adalah …","ok":"cara berkomunikasi pengganti atau pelengkap bicara, misalnya kartu bergambar","d":["aplikasi yang mengubah suara guru menjadi teks di layar PID kelas","metode belajar membaca huruf Braille dengan stiker timbul","pelatihan guru agar mampu mengoperasikan papan interaktif","program terapi untuk melatih artikulasi dan bicara murid rungu"],"e":"AAC membantu murid yang tidak berbicara atau sulit dipahami bicaranya menyampaikan pesan."},{"l":"C2","b":"Pendahuluan","ic":[],"s":"Modul nasional PID sudah ada, tetapi modul khusus SLB tetap disusun. Alasan yang paling sesuai dengan kata pengantar adalah …","ok":"pelatihan yang ada untuk sekolah umum, kelas SLB sangat beragam","d":["PID di SLB memakai sistem operasi yang berbeda dari sekolah umum","modul nasional tidak membahas satu pun fitur PID","SLB hanya menerima PID tanpa layar sentuh","guru SLB tidak diperbolehkan memakai modul nasional"],"e":"Guru SLB membutuhkan penerjemahan setiap fitur ke praktik kelas sesuai profil murid."},{"l":"C5","b":"Pendahuluan","ic":[],"s":"Seorang kepala SLB menyatakan, ‘PID kami sudah optimal karena dipakai memutar video setiap hari.’ Penilaian yang paling tepat berdasarkan modul adalah …","ok":"belum optimal, sebab PID semestinya menjadi alat akses bagi murid","d":["sudah optimal, sebab video adalah fungsi utama PID di SLB","sudah optimal, asalkan videonya bersubtitle","belum optimal, sebab video tidak boleh diputar di SLB","belum optimal, sebab PID hanya cocok untuk ujian"],"e":"Latar belakang modul: di banyak kelas PID baru dipakai memutar video, padahal dapat menjadi alat akses."},{"l":"C6","b":"Pendahuluan","ic":[],"s":"Seorang guru baru memulai PID di kelas yang berisi murid low vision, rungu, dan autis. Rancangan langkah awal yang paling sesuai anjuran modul adalah …","ok":"pilih satu fitur, coba pada satu murid seminggu, catat hasilnya","d":["mencoba seluruh fitur pada semua murid dalam satu hari","menunggu pelatihan lanjutan sebelum menyentuh PID","menyalin rencana guru lain tanpa menyesuaikan profil murid","memakai PID hanya sebagai layar video agar tidak berisiko"],"e":"Kata pengantar: mulai dari langkah kecil, satu fitur untuk satu murid dalam satu minggu."},{"l":"C1","b":"Bab 1","ic":[],"s":"Kelengkapan berikut termasuk paket PID bantuan, KECUALI …","ok":"speaker eksternal","d":["dua pena stylus","remote control dengan dua baterai","kabel touch (USB A ke USB B)","stand bracket"],"e":"Paket berisi dua stylus, remote, kabel daya, HDMI, kabel touch, stand bracket, dan buku manual."},{"l":"C1","b":"Bab 1","ic":[],"s":"Lampu indikator PID berwarna merah menandakan …","ok":"PID dalam mode siaga","d":["PID sedang menyala","modul OPS sedang aktif","kabel daya terlepas","baterai remote lemah"],"e":"Biru = menyala, merah = siaga, hijau = modul OPS aktif."},{"l":"C1","b":"Bab 1","ic":[],"s":"Menu Lima Jari dimunculkan dengan cara …","ok":"mengetuk layar dengan lima jari","d":["menggeser layar dari atas ke bawah","menggeser layar dari bawah ke atas","menekan tombol Freeze pada remote","menekan lama tombol power"],"e":"Geser ke bawah memunculkan notifikasi; geser ke atas memunculkan daftar aplikasi."},{"l":"C2","b":"Bab 1","ic":["tombol_power"],"s":"Tombol pada gambar berada di panel depan PID. Perbedaan hasilnya jika ditekan sebentar dan ditekan lama adalah …","ok":"sebentar: layar mati; lama: mode siaga","d":["sebentar: mode siaga; lama: layar mati","sebentar: restart; lama: factory reset","sebentar: membekukan layar; lama: menggelapkan layar","sebentar dan lama: sama-sama mematikan total"],"e":"Tekan sebentar membuat layar mati, tekan lama membuat PID masuk mode siaga."},{"l":"C2","b":"Bab 1","ic":[],"s":"Tombol Blank pada remote dimanfaatkan guru SLB untuk …","ok":"menggelapkan layar sementara saat murid kewalahan","d":["membekukan tampilan agar murid sempat memproses langkah","berpindah sumber sinyal dari PID ke laptop","mematikan PID secara total di akhir pelajaran","mengecilkan suara bagi murid yang peka suara"],"e":"Blank menghentikan rangsang visual; Freeze menahan tampilan."},{"l":"C2","b":"Bab 1","ic":[],"s":"Port HDMI out di bagian belakang PID berfungsi untuk …","ok":"menampilkan layar PID di monitor kedua untuk murid low vision","d":["menyambungkan laptop guru agar tampil di layar utama PID","menyalurkan suara ke headphone murid netra di kelas","menghubungkan PID ke internet kabel yang stabil","menyalurkan sentuhan layar saat laptop tersambung"],"e":"HDMI in untuk menerima laptop; HDMI out untuk menampilkan ke monitor lain."},{"l":"C3","b":"Bab 1","ic":["pengaturan"],"s":"Guru ingin menjadikan bahasa PID bahasa Indonesia. Jalur menu yang dipakai adalah …","ok":"Settings → Language & Input → Indonesian","d":["Settings → Network & Internet → Indonesian","Settings → Display → Indonesian","Papan tulis → Pengaturan → Bahasa","Source → Language → Indonesian"],"e":"Langkah 3 pada pengaturan awal."},{"l":"C3","b":"Bab 1","ic":[],"s":"Laptop guru sudah tampil lewat HDMI, tetapi sentuhan murid tidak merespons. Langkah yang dilakukan guru adalah …","ok":"menyambungkan kabel touch (USB-B) ke laptop","d":["menukar kabel HDMI dengan kabel LAN","menaikkan volume lewat Line out","mengaktifkan hotspot di PID","menekan tombol Blank pada remote"],"e":"Port Touch (USB-B) diperlukan agar layar sentuh berfungsi saat laptop tersambung."},{"l":"C3","b":"Bab 1","ic":["tombol_power"],"s":"Selesai mengajar, guru mematikan PID. Langkah yang benar adalah …","ok":"tekan power ± 3 detik, pilih Shutdown, tunggu 5 detik","d":["mencabut kabel daya supaya listrik langsung terputus","menekan power sebentar lalu menutup semua aplikasi","menekan Blank sampai layar benar-benar padam","menekan Freeze lalu menarik kabel HDMI"],"e":"Jangan mencabut kabel daya saat sistem aktif."},{"l":"C4","b":"Bab 1","ic":[],"s":"Gambar laptop tampil jelas di PID, tetapi layar tidak merespons stylus maupun jari. Dugaan penyebab yang paling masuk akal adalah …","ok":"kabel touch (USB-B) belum tersambung","d":["kabel HDMI putus sehingga gambar tidak mungkin tampil","volume terlalu kecil sehingga layar tidak peka","lampu indikator hijau sehingga layar terkunci","hotspot belum diaktifkan pada PID"],"e":"Gambar tampil berarti HDMI bekerja; yang belum bekerja adalah jalur sentuh."},{"l":"C4","b":"Bab 1","ic":[],"s":"Murid HI masih mengamati satu gambar langkah mencuci tangan, tetapi guru sudah akan berpindah halaman. Perbandingan terbaik kedua tombol remote adalah …","ok":"Freeze menahan gambar agar murid sempat memproses, sedangkan Blank justru menggelapkan layar","d":["Blank menahan gambar agar murid memproses, sedangkan Freeze menggelapkan layar","Freeze dan Blank sama-sama menahan gambar, bedanya hanya warna layar","Freeze mematikan PID sepenuhnya, sedangkan Blank membekukan tampilan","Freeze mengganti sumber sinyal, sedangkan Blank menurunkan volume"],"e":"Freeze dipakai agar murid HI dan autis punya waktu memproses; Blank dipakai saat murid kewalahan."},{"l":"C5","b":"Bab 1","ic":[],"s":"Seorang petugas mencabut kabel daya setiap sore agar ‘lebih cepat dan hemat listrik’. Penilaian yang paling tepat adalah …","ok":"tidak tepat; mencabut daya saat sistem aktif berisiko","d":["tepat, karena mencabut daya sama saja dengan Shutdown","tepat, asalkan dilakukan setelah layar dilap","tidak tepat, karena PID seharusnya dibiarkan menyala 24 jam","tidak tepat, karena yang benar adalah menekan Freeze"],"e":"Setelah mati, tunggu minimal 5 detik sebelum menyalakan kembali."},{"l":"C5","b":"Bab 1","ic":[],"s":"Layar PID dipasang sangat tinggi, kabel dibiarkan melintang, dan area depan layar dipenuhi meja. Penilaian yang paling sesuai catatan khusus kelas SLB adalah …","ok":"ketiganya bermasalah; tinggi layar, kabel, dan ruang bebas harus diperbaiki","d":["tidak masalah karena murid SLB jarang berjalan ke depan layar","hanya kabel yang bermasalah; tinggi layar dan meja aman","hanya tinggi layar yang bermasalah; kabel dan meja aman","semuanya aman selama roda bracket dibiarkan tidak dikunci"],"e":"Catatan 1.6: tinggi layar terjangkau, area bebas minimal satu meter, roda bracket terkunci, kabel tertutup."},{"l":"C6","b":"Bab 1","ic":[],"s":"Susunan langkah pengaturan awal PID yang paling sesuai modul adalah …","ok":"bracket → nyalakan → bahasa → Wi-Fi → akun belajar.id → PIN 4 digit","d":["buat PIN → ubah bahasa → nyalakan → periksa bracket → sambungkan Wi-Fi","nyalakan → masuk akun → periksa bracket → buat PIN → ubah bahasa","sambungkan Wi-Fi → buat PIN → nyalakan → ubah bahasa → periksa bracket","ubah bahasa → buat PIN → masuk akun → nyalakan → periksa bracket"],"e":"Urutan pada subbab 1.4 dimulai dari keselamatan fisik, lalu pengaturan perangkat, lalu akun dan PIN."},{"l":"C6","b":"Bab 1","ic":[],"s":"Kelas berisi satu murid kursi roda, satu murid netra, dan satu murid autis peka suara. Rancangan ruang yang paling sesuai adalah …","ok":"ruang bebas ≥ 1 meter, penanda timbul, kabel tertutup, murid autis jauh dari speaker","d":["layar setinggi mungkin, kabel di lantai, murid autis di depan speaker","meja berderet rapat di depan layar, kabel dibiarkan di jalur kursi roda","tanpa penanda taktil, murid autis di tengah, speaker di dekatnya","roda bracket dibiarkan bebas, murid netra ditempatkan jauh dari guru"],"e":"Gabungan subbab 1.6 dan tabel tata letak kelas pada subbab 3.1."},{"l":"C1","b":"Bab 1","ic":[],"s":"Tombol remote yang dipakai untuk berpindah dari layar PID ke laptop adalah …","ok":"Source","d":["Freeze","Blank","Mute" atur kecerahan dan volume","konkret dulu, digital kemudian","simpan dan bagikan hasil kerja ke orang tua"],"e":"Rancang giliran agar setiap murid menyentuh layar setiap pertemuan."},{"l":"C4","b":"Bab 3","ic":[],"s":"Pelajaran dimulai dengan video 40 menit tanpa benda nyata, lalu murid langsung mengerjakan soal simbol. Dua prinsip yang paling dilanggar adalah …","ok":"konkret dulu, digital kemudian; dan durasi pendek","d":["simpan dan bagikan; dan satu layar satu tujuan","bantuan makin berkurang; dan jaga kenyamanan sensori","waktu tunggu; dan murid menyentuh layar","multisensori; dan mulai dari profil murid"],"e":"Urutan yang dianjurkan benda nyata → video → simbol, dan aktivitas di layar 5–10 menit."},{"l":"C5","b":"Bab 3","ic":[],"s":"Rencana pertemuan: pembuka langsung ke ceramah, lalu video, kemudian soal tertulis, tanpa tahap refleksi dan tanpa menyimpan hasil. Penilaian yang paling tepat adalah …","ok":"belum sesuai pola; perlu murid berbuat, refleksi, dan ekspor hasil","d":["sudah sesuai, karena ceramah dan video cukup","sudah sesuai, karena soal tertulis adalah bukti belajar utama","belum sesuai, karena video tidak boleh dipakai sama sekali","belum sesuai, karena refleksi hanya untuk murid SMALB"],"e":"Pola: pembuka, memahami, mengaplikasi, merefleksi, penutup."},{"l":"C6","b":"Bab 3","ic":[],"s":"Susunan satu pertemuan dengan PID yang paling sesuai modul adalah …","ok":"jadwal visual → benda nyata + video → seret-lepas → gambar perasaan → ekspor","d":["ekspor hasil → video → sapa → soal tertulis → jadwal visual","soal tertulis → ceramah panjang → video → ekspor → sapa murid","video → ceramah → matikan PID → soal tertulis → jadwal visual","pilih gambar perasaan → ekspor → jadwal visual → video → soal"],"e":"Pembuka (berkesadaran) → memahami → mengaplikasi → merefleksi → penutup."},{"l":"C1","b":"Bab 4.1","ic":["papan_tulis"],"s":"Ukuran huruf slide yang dicontohkan modul untuk murid low vision (sesuai hasil asesmen) adalah …","ok":"≥ 28 pt","d":["≥ 12 pt","≥ 14 pt","≥ 18 pt","≥ 20 pt"],"e":"Uji dari tempat duduk murid."},{"l":"C2","b":"Bab 4.1","ic":[],"s":"Murid buta total memerlukan guru yang mengganti ‘lihat ini’ dengan deskripsi, karena …","ok":"PID bersifat visual sehingga akses lewat suara dan benda nyata","d":["murid buta total dapat membaca layar sentuh dengan jari","murid buta total memperoleh informasi terbaik dari warna layar","deskripsi hanya diperlukan agar video lebih panjang","PID otomatis membacakan semua tulisan di layar"],"e":"Kebiasaan wajib guru: membacakan yang ditulis, mendeskripsikan gambar, menyiapkan padanan taktil."},{"l":"C3","b":"Bab 4.1","ic":[],"s":"Guru menampilkan gambar perahu nelayan di Danau Limboto. Kalimat yang paling tepat untuk murid buta total adalah …","ok":"‘Ada gambar perahu nelayan di Danau Limboto, kecil dan memanjang.’","d":["‘Lihat ini, perahunya bagus sekali, ya, anak-anak.’","‘Perhatikan gambar di sebelah sana itu dengan baik.’","‘Kalian pasti sudah pernah melihat perahu seperti ini.’","‘Gambar ini sangat mudah, tidak perlu dijelaskan lagi.’"],"e":"Ganti ‘lihat ini’ dengan deskripsi dan siapkan padanan taktil."},{"l":"C3","b":"Bab 4.1","ic":["berbagi_layar","anotasi"],"s":"Murid low vision ingin membaca komposisi pada kemasan produk. Fitur PID yang dipakai adalah …","ok":"kamera HP/tablet, berbagi layar ke PID, lalu anotasi","d":["Efek Kuas dan Grafik Pintar pada Papan tulis","Banyak Penulis dan Freeze pada remote","Hotspot dan Line out di belakang PID","Ruang Murid dan Wordwall untuk kuis"],"e":"Aktivitas 4.1-A."},{"l":"C4","b":"Bab 4.1","ic":["papan_tulis"],"s":"Guru memakai latar hitam dengan pena merah dan teks kecil di pojok layar untuk murid low vision. Masalah utamanya adalah …","ok":"kontras buruk (merah di atas hitam) dan teks pojok kecil","d":["latar hitam tidak boleh dipakai untuk murid low vision","pena merah terlalu tebal untuk murid low vision","ukuran teks terlalu besar sehingga memenuhi layar","kecerahan terlalu rendah sehingga layar terlihat pudar"],"e":"Hindari merah di atas hitam, hijau di atas biru, dan tulisan kecil di pojok layar."},{"l":"C6","b":"Bab 4.1","ic":[],"s":"Murid buta total SDLB akan belajar mengenal benda dan bunyinya. Rancangan kegiatan yang paling sesuai adalah …","ok":"putar suara → tebak dan raba benda → ucapkan, rekam → putar ulang","d":["tampilkan gambar bunyi di layar → murid menunjuk dengan mata","putar video tanpa suara → murid menebak lewat warna","tampilkan tulisan nama benda → murid membaca dalam hati","putar video lagu → murid menyalin liriknya"],"e":"Aktivitas 4.1-C: speaker PID, benda/model, mikrofon untuk merekam."},{"l":"C2","b":"Bab 4.2","ic":[],"s":"Pada kelas rungu, guru sebaiknya berdiri di samping layar menghadap murid dengan wajah terkena cahaya. Alasannya adalah …","ok":"murid belajar lewat penglihatan sehingga perlu membaca ujaran dan ekspresi","d":["murid rungu memperoleh informasi utama dari suara guru","cahaya di wajah guru membuat layar PID lebih hemat energi","guru perlu menjauh dari murid agar layar terlihat jelas oleh semua","murid rungu hanya fokus pada layar dan mengabaikan guru"],"e":"Prinsip: keterarahan wajah, kekonkretan, visualisasi."},{"l":"C3","b":"Bab 4.2","ic":[],"s":"Guru memakai aplikasi transkripsi pada wawancara dengan pengrajin karawo. Langkah yang perlu dilakukan sebelumnya adalah …","ok":"menguji transkripsi dulu karena logat lokal bisa salah ditulis","d":["mematikan Wi-Fi agar transkripsi lebih akurat","meminta narasumber berbicara sambil membelakangi murid","menghapus kata kunci agar murid menebak","memutar video tanpa subtitle sebagai pembanding"],"e":"Catatan Aktivitas 4.2-D."},{"l":"C4","b":"Bab 4.2","ic":[],"s":"Guru menjelaskan sambil menulis di PID membelakangi kelas, sehingga murid rungu bingung. Penyebab kebingungan yang paling tepat adalah …","ok":"murid tidak dapat membaca ujaran dan ekspresi guru yang membelakangi","d":["suara guru terlalu pelan sehingga tidak terdengar oleh murid","tulisan guru terlalu rapi sehingga sulit dibaca","layar PID tidak mampu menampilkan tulisan tangan","murid rungu tidak dapat membaca tulisan tangan guru di PID"],"e":"Perbaikan: tulis dulu, lalu berbalik dan jelaskan."},{"l":"C5","b":"Bab 4.2","ic":[],"s":"Guru memutar video tanpa subtitle dan memberi penjelasan panjang tanpa teks untuk murid rungu. Penilaian paling tepat adalah …","ok":"tidak memadai; pilih video bersubtitle dan tulis kata kunci","d":["memadai, karena murid rungu cukup melihat gambar bergerak","memadai, asalkan volume dinaikkan","tidak memadai, karena video tidak boleh dipakai bagi murid rungu","tidak memadai, karena subtitle hanya untuk murid low vision"],"e":"Hindari video tanpa subtitle, penjelasan panjang tanpa teks, dan menutup mulut saat berbicara."},{"l":"C6","b":"Bab 4.2","ic":["papan_tulis","ekspor"],"s":"Guru SDLB–SMPLB akan membuat kamus isyarat kelas bersama murid rungu. Rancangan yang paling sesuai Aktivitas 4.2-A adalah …","ok":"foto + nama → peragaan isyarat → murid merekam → satu halaman → QR","d":["nama benda saja → murid menghafal → ujian lisan → nilai","video tanpa isyarat → murid menyalin → simpan di grup umum","foto benda → guru menjelaskan lisan → murid diam → selesai","isyarat dari internet → cetak → bagikan tanpa murid merekam"],"e":"Kamus kelas menggabungkan gambar, tulisan, dan isyarat."},{"l":"C2","b":"Bab 4.3","ic":["tambah_halaman","hal_berikutnya"],"s":"Mengapa analisis tugas bergambar (satu langkah per halaman) cocok untuk murid HI sedang?","ok":"karena langkah dipecah bertahap, satu langkah per tampilan","d":["karena semua langkah tampil sekaligus dalam satu layar","karena murid cukup menghafal urutan tanpa praktik nyata","karena PID otomatis menilai kemandirian murid","karena halaman tidak boleh lebih dari satu"],"e":"Murid HI belajar paling baik dengan materi konkret, langkah bertahap, dan pengulangan."},{"l":"C3","b":"Bab 4.3","ic":[],"s":"Guru menyiapkan halaman untuk murid HI sedang. Rancangan tampilan yang tepat adalah …","ok":"foto nyata, 2–3 pilihan, satu langkah per halaman","d":["tulisan panjang, 5 pilihan, semua langkah dalam satu halaman","gambar kecil, 8 pilihan, animasi cepat","instruksi berantai, 4 pilihan, tanpa foto nyata","hanya tulisan tanpa gambar dan tanpa pilihan"],"e":"Tabel pemanfaatan PID menurut tingkat dukungan (4.3)."},{"l":"C3","b":"Bab 4.3","ic":["papan_tulis"],"s":"Pada Aktivitas 4.3-B, murid HI sedang dan murid HI ringan diberi tugas berbeda. Diferensiasi yang tepat adalah …","ok":"murid sedang mulai dengan dua pilihan uang; murid ringan menghitung kembalian","d":["murid sedang menghitung kembalian; murid ringan memilih dua uang","keduanya diberi tugas yang sama persis tanpa perbedaan apa pun","murid sedang tanpa uang asli; murid ringan tanpa gambar","murid sedang menghafal harga barang; murid ringan hanya menonton"],"e":"Diferensiasi Aktivitas 4.3-B."},{"l":"C4","b":"Bab 4.3","ic":[],"s":"Guru memberi instruksi ‘ambil, geser, lalu tulis’ dalam satu kalimat pada layar penuh tulisan dengan lima pilihan. Murid HI diam. Penyebab paling mungkin adalah …","ok":"instruksi berantai, layar penuh tulisan, dan pilihan terlalu banyak","d":["murid HI menolak memakai PID karena ingin menentang guru","stylus kehabisan baterai sehingga tidak bisa dipakai","volume terlalu keras sehingga murid terganggu","layar terlalu terang sehingga murid merasa silau dan menutup mata"],"e":"Hindari layar penuh tulisan, banyak pilihan, instruksi berantai, dan perpindahan halaman sebelum murid selesai."},{"l":"C6","b":"Bab 4.3","ic":["tambah_halaman","hal_berikutnya"],"s":"Rancangan Aktivitas 4.3-A (mencuci tangan) yang paling sesuai adalah …","ok":"foto langkah → satu foto per halaman → video modeling → praktik nyata","d":["video tanpa foto → satu halaman tulisan → hafalan → ujian lisan","foto tujuh langkah di satu halaman → murid menonton saja","tulisan langkah → ceramah guru → praktik tanpa panduan","video dewasa → tanpa praktik → nilai dari hafalan"],"e":"Setiap langkah dicatat tingkat bantuannya."},{"l":"C2","b":"Bab 4.4","ic":[],"s":"Halaman pertama PID untuk murid autis selalu jadwal visual pelajaran hari itu. Alasannya adalah …","ok":"murid tahu yang akan terjadi sehingga situasi dapat diprediksi","d":["murid dapat memilih sendiri pelajaran yang paling disukai","guru tidak perlu menjelaskan tujuan pelajaran","murid terbiasa dengan perubahan jadwal mendadak","jadwal membuat PID terlihat lebih menarik di mata murid"],"e":"Rutinitas yang dapat diprediksi adalah kunci keberhasilan bagi murid autis."},{"l":"C3","b":"Bab 4.4","ic":[],"s":"Guru akan berpindah dari kegiatan membaca ke menghitung. Agar murid autis tenang, guru …","ok":"menampilkan timer visual dan memakai bunyi/isyarat yang sama","d":["langsung mengganti layar tanpa pemberitahuan","menaikkan volume suara agar murid cepat berpindah kegiatan","mematikan PID sebentar lalu menyalakannya lagi","mengganti tata letak halaman dan warna setiap hari"],"e":"Tabel pengaturan PID untuk murid autis: transisi."},{"l":"C4","b":"Bab 4.4","ic":[],"s":"Di akhir pelajaran, PID dimatikan mendadak dan murid autis menangis. Analisis penyebab dan perbaikan yang tepat adalah …","ok":"layar hilang tanpa aba-aba; beri timer dan kartu ‘selesai’ dulu","d":["volume terlalu pelan; naikkan volume sebelum mematikan","jadwal terlalu pendek; perpanjang pelajaran tanpa batas","kecerahan terlalu tinggi; turunkan kecerahan saja","stylus kurang tebal; ganti stylus bergagang besar"],"e":"Hindari mematikan PID tanpa aba-aba; sediakan kartu ‘selesai’."},{"l":"C5","b":"Bab 4.4","ic":[],"s":"Seorang guru menjadikan PID satu-satunya hadiah bagi murid autis yang menyelesaikan tugas. Penilaian yang paling tepat adalah …","ok":"kurang tepat; PID bukan satu-satunya penguat","d":["tepat, karena PID adalah penguat terbaik bagi semua murid","tepat, asalkan hadiah diberikan sebelum tugas","kurang tepat, karena murid autis tidak boleh memakai PID","kurang tepat, karena hadiah tidak boleh diberikan"],"e":"Hindari menjadikan PID satu-satunya hadiah."},{"l":"C6","b":"Bab 4.4","ic":[],"s":"Murid SDLB autis akan berkunjung ke kantin yang ramai besok. Rancangan cerita sosial yang paling sesuai adalah …","ok":"4–6 slide foto asli berkalimat positif, dibaca sebelum kunjungan","d":["20 slide berisi larangan, dibaca sekali setelah kunjungan","satu slide teks panjang dibacakan cepat sebelum berangkat","video acak dari internet tanpa narasi guru","slide hanya berisi tulisan ‘jangan ribut’"],"e":"Aktivitas 4.4-B: contoh kalimat positif ‘Aku boleh memakai headphone. Aku antre dan membayar.’"},{"l":"C2","b":"Bab 4.5","ic":[],"s":"Pernyataan yang tepat tentang murid MDVI adalah …","ok":"murid dengan hambatan penglihatan yang disertai hambatan lain","d":["murid dengan hambatan pendengaran dan bicara saja","murid dengan hambatan intelektual tanpa hambatan lain","murid dengan hambatan fisik yang sudah pulih","murid tanpa hambatan yang belajar di kelas khusus"],"e":"MDVI termasuk hambatan majemuk; layar hanya pelengkap, utamakan isyarat taktil dan benda asli."},{"l":"C3","b":"Bab 4.5","ic":["berbagi_layar"],"s":"Murid cerebral palsy tidak dapat berdiri dan sulit menggenggam stylus kecil. Akomodasi yang tepat adalah …","ok":"tablet di meja, stylus tebal, Grafik Pintar, waktu tambahan","d":["kuis berbatas waktu, target kecil, murid berdiri di depan","mouse kecil di meja jauh, tanpa waktu tambahan","stylus tipis, tanpa Grafik Pintar, target kecil","murid dibimbing berdiri sendiri tanpa dukungan"],"e":"Alternatif sentuh: tablet di meja, mouse besar, trackball, keyboard adaptif melalui port USB."},{"l":"C5","b":"Bab 4.5","ic":[],"s":"Kelas SMPLB berisi murid hambatan fisik diberi kuis dengan batas waktu ketat. Penilaian paling tepat adalah …","ok":"tidak sesuai; keterbatasan motorik butuh waktu tambahan","d":["sesuai; batas waktu melatih ketahanan fisik","sesuai; murid fisik selalu cepat bergerak","tidak sesuai; murid fisik tidak boleh mengikuti kuis","tidak sesuai; kuis hanya untuk murid rungu"],"e":"Tabel pengaturan PID hambatan fisik: ‘Waktu dan istirahat’."},{"l":"C2","b":"Bab 4.6","ic":[],"s":"Pasangan contoh dan tingkat AAC yang benar adalah …","ok":"kartu gambar – sederhana; aplikasi AAC di tablet – tinggi; isyarat – tanpa alat","d":["kartu gambar – tanpa alat; isyarat – teknologi tinggi; aplikasi AAC – sederhana","aplikasi AAC – teknologi sederhana; kartu gambar – tinggi; isyarat – tanpa alat","papan komunikasi – teknologi tinggi; isyarat – sederhana; gestur – tanpa alat","gestur – teknologi tinggi; kartu gambar – tanpa alat; isyarat – sederhana"],"e":"Tanpa alat, teknologi sederhana, teknologi tinggi."},{"l":"C3","b":"Bab 4.6","ic":["papan_tulis"],"s":"Guru menyusun satu halaman tetap papan komunikasi di PID. Isi yang tepat adalah …","ok":"8–12 kata inti bergambar, misalnya mau, tidak, lagi","d":["100 kata acak tanpa disertai gambar apa pun","hanya kata benda bergambar berukuran kecil","tiga foto murid tanpa kata sama sekali","puluhan kata yang letaknya berganti tiap hari"],"e":"Letak gambar tidak berubah dari hari ke hari."},{"l":"C4","b":"Bab 4.6","ic":[],"s":"Guru bertanya ‘mau apa?’ lalu langsung memberikan botol minum tanpa menunggu respons murid nonverbal. Kesalahan yang paling tepat adalah …","ok":"menebak terlalu cepat tanpa waktu tunggu 10–20 detik","d":["memakai gambar yang berukuran terlalu besar","menyediakan papan komunikasi di meja murid","memodelkan dengan menyentuh gambar kata inti","menyediakan rekaman suara pada setiap gambar"],"e":"Hindari menjawabkan untuk murid dan menebak terlalu cepat."},{"l":"C5","b":"Bab 4.6","ic":[],"s":"Guru menolak memberi biskuit sampai murid nonverbal ‘mengucapkan kata mau’. Penilaian yang paling tepat adalah …","ok":"kurang tepat; keinginan dipenuhi dulu, AAC boleh dipakai","d":["tepat, karena bicara adalah satu-satunya komunikasi","tepat, karena AAC menghambat perkembangan bicara","kurang tepat, karena murid nonverbal tidak pernah ingin makan","kurang tepat, karena biskuit tidak boleh dibawa ke kelas"],"e":"Hindari menuntut murid berbicara sebelum keinginannya dipenu ktu tambahan"],"e":"Guru membahas jawaban salah bersama kelompok."},{"l":"C5","b":"Bab 5","ic":[],"s":"Guru ingin murid SMALB berlatih QRIS memakai rekening asli murid di toko tanpa pendampingan. Penilaian paling tepat adalah …","ok":"tidak aman; lakukan simulasi di layar tanpa rekening asli","d":["aman, karena murid SMALB sudah dewasa","aman, asalkan PIN dibagikan kepada teman","tidak aman, karena QRIS tidak boleh dibahas di kelas","tidak aman, karena simulasi tidak berguna"],"e":"Aktivitas 26: simulasi di layar, diskusi keamanan PIN."},{"l":"C6","b":"Bab 5","ic":[],"s":"Kelas tata boga SMALB ingin memasarkan kue tradisional dengan produk digital. Rancangan aktivitas yang paling utuh adalah …","ok":"foto produk → Canva katalog → hitung laba → bagikan QR → rubrik","d":["tonton video kue → hafalkan resep → ujian tulis → selesai","unduh katalog orang lain → cetak → tanpa produk murid","pesan makanan online → tanpa murid → tanpa asesmen","lomba cepat membuat kue → tanpa dokumentasi → tanpa laporan"],"e":"Mengacu Aktivitas 21–22 dan studi kasus 9.4 nomor 3."},{"l":"C2","b":"Bab 6","ic":[],"s":"Komponen perencanaan Pembelajaran Mendalam pada contoh Bab 6 adalah …","ok":"identifikasi, desain, pengalaman belajar, asesmen","d":["tujuan, materi, metode, dan evaluasi","pembukaan, inti, dan penutup","input, proses, output, dan outcome","perencanaan, pelaksanaan, pengawasan, dan pelaporan"],"e":"Tiga contoh: SDLB kelas IV, SMPLB kelas VIII (rungu), SMALB kelas XI."},{"l":"C3","b":"Bab 6","ic":["berbagi_layar"],"s":"Pada perencanaan 6.1, Nia (low vision) duduk dekat layar dan menghitung kembalian di tablet. Fitur PID yang mendukung adalah …","ok":"berbagi layar ke tablet Nia","d":["tombol Blank pada remote","Papan Tulis Ganda saja","hotspot dan Line out","kamera 4K tanpa berbagi layar"],"e":"Berbagi layar membuat Nia melihat dari dekat."},{"l":"C4","b":"Bab 6","ic":[],"s":"Dimas (autis disertai HI; cemas di tempat ramai) membaca cerita sosial ‘ke kantin’ sebelum praktik. Fungsi k":"video subtitle → kamus isyarat → seret-lepas kartu → praktik masak","d":["video tanpa subtitle → ceramah → ujian tulis → selesai","ceramah panjang → hafalan langkah → tanpa praktik","video dengan suara keras → murid menyalin → tanpa isyarat","praktik memasak tanpa rencana → tanpa refleksi → tanpa asesmen"],"e":"Pengalaman belajar pada 6.2."},{"l":"C1","b":"Bab 7","ic":[],"s":"Asesmen di SLB dengan bantuan PID memakai acuan …","ok":"individu, yaitu membandingkan capaian murid dengan kondisi awalnya sendiri","d":["norma kelompok, yaitu membandingkan murid dengan rata-rata kelas","peringkat kelas, yaitu mengurutkan murid dari nilai tertinggi","KKM kelas reguler, yaitu ambang nilai sama untuk semua murid","rata-rata sekolah, yaitu nilai pembanding antar-SLB"],"e":"Asesmen formatif dipakai untuk umpan balik dan tidak digabung dengan nilai sumatif."},{"l":"C2","b":"Bab 7","ic":[],"s":"Ranah akomodasi asesmen yang dibahas pada subbab 7.2 adalah …","ok":"soal atau instrumen, format jawaban, setting, dan waktu","d":["guru, kepala sekolah, pengawas, dan orang tua","teori, praktik, proyek, dan portofolio","awal, proses, akhir, dan tindak lanjut","jarak, warna, suara, dan cahaya"],"e":"Contoh: soal dibacakan, jawaban dengan menyeret, dikerjakan satu per satu, tanpa batas waktu."},{"l":"C3","b":"Bab 7","ic":[],"s":"Murid mengerjakan 6 langkah: 2 langkah mandiri (M), 3 langkah dengan petunjuk (P), dan 1 langkah dengan bantuan verbal (BV). Kategori A ≥ 80%, B 70–80%, C 51–69%, D ≤ 50%. Hasilnya adalah …","ok":"Kategori B (79,2%)","d":["Kategori A (85%)","Kategori C (62,5%)","Kategori D (50%)","Kategori B (70,8%)"],"e":"Skor = 2×4 + 3×3 + 1×2 = 19 dari 24, yaitu 79,2% → kategori B."},{"l":"C3","b":"Bab 7","ic":["ambil"],"s":"Guru ingin menyimpan bukti asesmen proses berupa jawaban murid di layar PID. Bukti dan caranya yang tepat adalah …","ok":"tangkapan layar harian (Ambil) + observasi BF–BV–P–M","d":["ekspor PDF akhir semester saja","foto wajah murid yang diunggah ke grup umum","video presentasi akhir tanpa observasi proses","lembar jawaban tertulis tanpa dokumentasi layar"],"e":"Bukti proses: tangkapan layar harian, rekaman video, log kuis."},{"l":"C4","b":"Bab 7","ic":[],"s":"Perhatikan laporan: ‘Rani dapat memilih uang Rp2.000 dan Rp5.000 secara mandiri, masih memerlukan petunjuk gambar untuk Rp1.000.’ Analisis yang paling tepat tentang laporan ini adalah …","ok":"mendeskripsikan kemampuan dan kebutuhan Rani terhadap kondisi awalnya","d":["membandingkan Rani dengan peringkat teman sekelas","hanya memberi angka tanpa penjelasan kemampuan maupun kebutuhan","menilai Rani dari kecepatan menyelesaikan tugas","tidak memuat tindak lanjut apa pun untuk Rani di rumah"],"e":"Contoh laporan 7.5 memuat kemampuan, kebutuhan dukungan, dan latihan di rumah."},{"l":"C5","b":"Bab 7","ic":[],"s":"Dua laporan: (1) ‘Rani nilai 70, peringkat 3 dari 5’; (2) ‘Rani dapat memilih uang Rp2.000 mandiri, masih memerlukan petunjuk untuk Rp1.000.’ Penilaian yang paling tepat adalah …","ok":"laporan (2) lebih sesuai: berbasis acuan individu dan memberi arah","d":["laporan (1) lebih sesuai karena memuat angka dan peringkat","keduanya sama baiknya karena sama-sama memuat informasi murid","keduanya tidak sesuai karena SLB tidak memerlukan laporan","laporan (1) lebih sesuai karena murid dibandingkan dengan teman sekelas"],"e":"Asesmen SLB memakai acuan individu, bukan perbandingan antarmurid."},{"l":"C6","b":"Bab 7","ic":["ambil","ekspor"],"s":"Guru akan menyusun portofolio digital untuk 5 murid. Rancangan yang paling sesuai subbab 7.4 adalah …","ok":"folder Drive per murid, nama samaran/kode, seleksi 3–5 bukti tiap bulan","d":["satu folder bersama berisi nama lengkap semua murid di grup umum","foto murid disimpan di akun pribadi guru tanpa seleksi","semua bukti dihapus setelah dibagikan ke orang tua","portofolio dibuat di akhir tahun dari ingatan guru"],"e":"Gunakan bukti untuk laporan deskriptif dan evaluasi PPI."},{"l":"C1","b":"Bab 8","ic":[],"s":"Perawatan rutin yang dilakukan setiap hari adalah …","ok":"mengelap layar, memeriksa kabel dan bracket, Shutdown","d":["memperbarui aplikasi dan menghapus akun tak terpakai","mengencangkan baut bracket dan menguji sentuh menyeluruh","menguji Banyak Penulis, Transkripsi, dan berbagi layar","perawatan menyeluruh perangkat keras dan lunak"],"e":"Kegiatan lain dilakukan mingguan, bulanan, tiga bulanan, dan tiap semester."},{"l":"C2","b":"Bab 8","ic":[],"s":"Sebelum factory reset, guru perlu mencatat aplikasi dan pengaturan yang dipakai murid karena …","ok":"factory reset menghapus semuanya sehingga perlu dipasang ulang","d":["factory reset hanya menghapus tampilan layar","factory reset otomatis memulihkan semua aplikasi","pencatatan diwajibkan oleh penyedia untuk garansi layanan","pencatatan membuat PID bekerja jauh lebih cepat setelah reset"],"e":"Subbab 8.3."},{"l":"C3","b":"Bab 8","ic":[],"s":"Layar PID merespons sentuhan sendiri secara acak. Langkah penanganan yang tepat adalah …","ok":"bersihkan layar, pastikan tak ada yang menempel, mulai ulang","d":["mengganti kabel HDMI lalu menaikkan volume speaker","membuat PIN baru lalu mengganti baterai remote dan stylus","memindahkan hotspot PID ke jaringan Wi-Fi yang lain","factory reset langsung tanpa memeriksa apa pun"],"e":"Penyebab umum: layar kotor/basah atau tangan/benda menempel di tepi layar."},{"l":"C4","b":"Bab 8","ic":["pengaturan"],"s":"PID tiba-tiba bersuara setiap disentuh dan layar tidak bisa dipakai seperti biasa. Penyebab yang paling mungkin adalah …","ok":"fitur aksesibilitas aktif tanpa sengaja karena pintasan tersentuh","d":["port Line out rusak sehingga suara terus bocor dari speaker","baterai remote habis dan mengirim sinyal acak","memori penuh sehingga PID mengeluarkan bunyi peringatan","layar basah sehingga speaker menyala otomatis"],"e":"Solusi: Settings → Aksesibilitas, nonaktifkan fitur dan pintasannya."},{"l":"C5","b":"Bab 8","ic":[],"s":"Guru memakai AI publik dengan perintah: ‘Andi Pratama, 12 tahun, diagnosis autisme, SLB X, buatkan kegiatan.’ Penilaian yang paling tepat adalah …","ok":"tidak aman; nama asli dan diagnosis tidak boleh dimasukkan","d":["aman, karena AI tidak menyimpan data apa pun","aman, asalkan sekolah disebut lengkap","tidak aman, karena AI tidak boleh dipakai oleh guru","tidak aman, karena kegiatan harus dibuat tanpa AI"],"e":"Subbab 8.4: gunakan nama samaran dan deskripsi fungsional."},{"l":"C5","b":"Bab 8","ic":[],"s":"Foto dan hasil asesmen murid disimpan di grup WhatsApp umum dan diunggah ke media sosial tanpa izin. Penilaian yang tepat adalah …","ok":"melanggar; simpan di akun sekolah dan minta izin orang tua","d":["tidak masalah karena foto murid bukan data sensitif","tidak masalah asalkan nama murid disingkat","melanggar hanya jika diunggah di hari libur","melanggar hanya jika murid berusia di atas 12 tahun"],"e":"Jangan bagikan akun guru kepada murid; tutup penutup kamera saat tidak dipakai."},{"l":"C6","b":"Bab 8","ic":[],"s":"Guru SMPLB ingin menyusun SOP penggunaan PID yang dapat dipahami semua murid. Rancangan yang paling sesuai subbab 8.1 adalah …","ok":"tata tertib bergambar dengan versi Braille dan video isyarat","d":["tata tertib tulisan kecil di pojok dinding tanpa gambar atau Braille","SOP lisan sekali di awal tahun tanpa kartu langkah","kartu langkah disimpan di laci guru agar tidak rusak","satu murid menjadi petugas tetap sepanjang tahun"],"e":"Stylus dan remote disimpan di wadah berlabel foto dan tanda timbul."},{"l":"C2","b":"Bab 9","ic":[],"s":"Ceklis observasi pembelajaran dengan PID (9.2) dimaksudkan sebagai …","ok":"bahan dialog reflektif, bukan sekadar penilaian administrasi","d":["alat untuk menghukum guru yang dianggap kurang cakap","syarat otomatis untuk kenaikan pangkat guru","pengganti rapor murid pada akhir semester","daftar inventaris perangkat PID di sekolah"],"e":"Penggunanya: kepala sekolah dan pengawas."},{"l":"C3","b":"Bab 9","ic":[],"s":"Guru bertanya pada diri sendiri: ‘Apakah PID membuat murid lebih aktif, atau saya yang lebih banyak di depan layar?’ Tindakan perbaikan yang tepat adalah …","ok":"merancang giliran agar setiap murid menyentuh layar","d":["menambah durasi ceramah guru di depan layar","mengurangi jumlah murid yang memakai PID","menayangkan video lebih panjang","memindahkan semua aktivitas ke buku tulis"],"e":"Refleksi diri 9.3 nomor 3, terkait prinsip murid yang menyentuh layar."},{"l":"C4","b":"Bab 9","ic":[],"s":"Pak Rahman memakai PID hanya untuk menayangkan video, dan murid rungu di kelasnya bingung. Penyebab yang paling utama adalah …","ok":"informasi hanya lewat video tanpa subtitle dan tanpa murid berbuat","d":["layar PID terlalu besar sehingga sulit dilihat murid rungu","murid rungu tidak dapat melihat gambar yang bergerak","stylus tidak tersedia di kelas tersebut sama sekali","volume video terlalu kecil sehingga murid rungu tidak mendengar"],"e":"Kunci arah jawaban 9.4 nomor 2."},{"l":"C5","b":"Bab 9","ic":[],"s":"Hasil ceklis kesiapan: PID menyala, bahasa Indonesia, tersambung internet, tetapi ada kabel melintang, tidak ada penanda taktil, dan tidak ada papan komunikasi. Penilaian yang paling tepat adalah …","ok":"belum siap; keselamatan, akses taktil, dan komunikasi belum dipenuhi","d":["sudah siap, karena PID menyala dan tersambung ke internet","sudah siap, karena kabel melintang tidak berbahaya","belum siap, karena PID harus dimatikan dulu sebelum diperiksa","belum siap, karena internet harus lewat hotspot"],"e":"Ceklis 9.1 mensyaratkan kabel tertutup, penanda taktil, dan papan komunikasi kata inti."},{"l":"C6","b":"Bab 9","ic":[],"s":"Bu Fitri mengajar kelas II: 2 murid HI sedang, 1 autis, 1 low vision, 1 rungu. Rancangan kegiatan angka 1–5 (15 menit) yang paling utuh adalah …","ok":"satu tema, banyak jalur: pilihan, timer, huruf besar, dan isyarat sesuai murid","d":["satu video angka yang sama untuk semua murid tanpa penyesuaian","angka 1–20 tertulis di buku tulis tanpa memakai PID sama sekali","kuis cepat berbatas waktu ketat yang sama untuk semua murid","ceramah guru tentang angka dari awal hingga akhir tanpa benda nyata maupun PID"],"e":"Kunci arah jawaban 9.4 nomor 1."},{"l":"C6","b":"Bab 9","ic":[],"s":"Kepala SLB ingin menindaklanjuti modul. Rancangan yang paling sesuai bagian Penutup adalah …","ok":"tetapkan penanggung jawab, jadwal, anggaran, dan komunitas belajar","d":["menyerahkan PID kepada satu operator tanpa jadwal pakai","menunda kegiatan sampai ada pelatihan nasional berikutnya","menyimpan PID di gudang supaya tidak mudah rusak dan hilang","menghentikan kegiatan berbagi praktik baik antarguru dan antar-SLB"],"e":"Rekomendasi tindak lanjut: guru, kepala sekolah, komunitas belajar, pengawas."}],IC={"ambil":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGAAAABgCAIAAABt+uBvAAALfUlEQVR4nO2ce3QU1R3H72Nmd5PwSDYhIQ8gEUKCUk0AgYSHikCQPAhJQCpYaQTq8Si+tVat1fYc29pjbe0BeYgKIQT0FAySEJKAglaQ8Ay0ECAm5MEz791sdmbuvf3jZodJsBna7mz0nPn8kZPdnZ299zu/+3vN3YWMMWDyn0H9PYAfOqZAOpgC6WAKpIMpkA6mQDqYAulgCqSDKZAOpkA6mALpYAqkgymQDqZAOpgC6WAKpIPgVmh/j+EHjSDJZkexLwQI+3sIP2xMH6SDKZAOpkA6mALpYAqkgymQDqZAOpgC6WAKpIMpkA5Cf30w31UCb6HSUfef3MrBXqc/LUided9bcKAHnwyqN76woF4mwBhTn6GUIoTATQalfUgpVd+ungFCSCn1gXD9sMQYYwghCBGEgBDCGPveqXIV+MGCgClllFL+pC9H6wuB+DyBxxb4xa+puSC53SNHxQqCwKetWgc/sttGEOroaG9saBw0aHBISLBosXCZEEIIIfWExg3eRz5Iu7gghM5O5ztv/zF36ZLy0hKEcK9X+Vv4QwHBTz/Ztmhh1vq1q65fvwY8Bgj0PJe38J2TVm2EUupns8myu/LkyYL8za2tzRhj1TF5LIgoiiyKYlVVVUH+pvPnqqw2W0BAAGMMeI70jef2aRTjU6KU2my2hYsWx48ZU1a+Z8P6dW2tLVwjjQ9GGAuS5N5TUnzsyJGEhIS5qWlB9mBCCNDo4gON+iHMQwhlWUlKTs7KWQAh3LTxw3Pnz1utWPXB/K/FYjl6pGJ3cZFosaRlZN522yhCiCox6BkNjaMfBEIIEaL4+/svXvKzOSlzz1VVFeRvunz5GsaYdsMAAC0tzevXrf36q/2paelLc5f5+QfIsowQ6uWkDB+t0R+gBULI/SuEmBA6evTIlLmpVpt1+6effH3gAF9lPH4xxiq+PbT/i70WizUtPTM0NJQQBXg8FD8JD2RGj9nLH9DrkvZ6qC4ihCAATJJoUlLyokWLO11dBfmbTp8+ZbFYGGOiKFy4cH7tmtVXr1yZNTtl2r33cdeMMdZ6nB9fFOPXn2lQk2AONw2PRliS5PCIyKW5y6Kjo4uKdpUUF0EIMcadnc6NH23Yt7f8zoSEhT99yG4PUhMf4Ekgga9KM28KpC2a+qhFtdNjjCWOH5+7fIVosXyydcuhg99YrcLxY0e3btlssVhyl62YOXO25JYAYAghbaLks29QeHmJaRXhHofblP   h+=`<div class="card"><h2>💡 Temuan otomatis</h2>${bb.length?`<div class="ins"><span>🎯</span><div>Materi paling lemah: <b>${bb[0]}</b> (${pct(A.B[bb[0]][0],A.B[bb[0]][1])}%). Disarankan dibahas ulang secara klasikal.</div></div>`:""}${wl?`<div class="ins"><span>🧠</span><div>Level kognitif terendah: <b>${wl.c} ${wl.n}</b> (${pct(A.L[wl.c][0],A.L[wl.c][1])}%).</div></div>`:""}<div class="ins"><span>👥</span><div>Tuntas (≥80%): <b>${cat[0]}</b> · Cukup (60–79%): <b>${cat[1]}</b> · Perlu pendampingan (&lt;60%): <b>${cat[2]}</b> peserta.</div></div>${!bb.length?'<span class="mut">Menunggu peserta memainkan level.</span>':""}</div>
  <div class="card"><h2>Penguasaan per materi (terendah dulu)</h2>${bars(A.B,bb)}</div>
  <div class="card"><h2>Soal paling sulit</h2>${hard.map(([id,v])=>`<div class="ins"><span style="font-weight:800;color:${col(pct(v[0],v[1]))}">${pct(v[0],v[1])}%</span><div><b>${esc(Q[id].l)} · ${esc(Q[id].b)}</b><br>${esc(Q[id].s)}<br><span class="mut sm">Kunci: ${esc(Q[id].ok)} · dijawab ${v[1]}×</span></div></div>`).join("")||'<span class="mut sm">Butuh minimal 2 jawaban per soal.</span>'}</div>`}
 if(tab==="set"){if(!draft)draft=clone(cfg);const d=draft;
  h+=`<div class="card"><h2>Aturan permainan</h2><label>Batas percobaan per level (0 = tanpa batas)</label><input type="number" min="0" max="20" value="${d.max}" oninput="draft.max=+this.value||0">
  <label>Pendaftaran peserta</label><select onchange="draft.open=this.value==='1'"><option value="1" ${d.open?"selected":""}>Dibuka</option><option value="0" ${d.open?"":"selected"}>Ditutup</option></select>
  <label>Mode</label><select onchange="draft.mode=this.value"><option value="tim" ${d.mode==="tim"?"selected":""}>Duel antar tim</option><option value="solo" ${d.mode==="solo"?"selected":""}>Perorangan</option></select>
  <label>Nama tim (satu per baris)</label><textarea oninput="draft.teams=this.value.split('\\n').map(s=>s.trim()).filter(Boolean)">${esc(d.teams.join("\n"))}</textarea>
  <label>Level yang dibuka</label><div class="row">${LV.map((l,i)=>`<label style="margin:0;font-weight:600"><input type="checkbox" style="width:auto" ${d.lv[i]?"checked":""} onchange="draft.lv[${i}]=this.checked?1:0"> ${l.c}</label>`).join("")}</div>
  <label>Pengumuman untuk peserta</label><input value="${esc(d.msg)}" oninput="draft.msg=this.value" placeholder="Contoh: Istirahat 10 menit, lanjut pukul 10.30">
  <label>Tautan peserta (untuk barcode)</label><input value="${esc(d.link)}" oninput="draft.link=this.value;qr()"><p class="c"><div id="qrbox" style="display:inline-block;background:#fff;padding:10px;border-radius:12px"></div></p>
  <p><button onclick="saveCfg()">💾 Simpan pengaturan</button></p></div>
  <div class="card"><h2>Zona hati-hati</h2><button class="bad" onclick="resetAll()">Reset seluruh permainan (hapus semua peserta)</button></div>`}
 shell0(h);if(tab==="set")qr()}
const shell0=h=>R(`<div class="top"><div class="logo">🎛️</div><div><b>Panel Fasilitator</b><div class="sm mut">Misi PID Arena</div></div></div>${h}`);
function qr(){const b=$("#qrbox");if(!b||!draft||typeof QRCode==="undefined")return;b.innerHTML="";try{new QRCode(b,{text:draft.link||URL0||"https://claude.ai",width:190,height:190})}catch(e){}}
async function saveCfg(){try{await db.doc("cfg/main").set(draft);msg="Pengaturan tersimpan ✅"}catch(e){msg="Gagal menyimpan"}draft=null;dash()}
async function resetAtt(id){const p=PL[id];if(!p)return;p.att={};try{await db.doc("players/"+id).set(p);msg="Percobaan "+p.name+" direset ✅"}catch(e){msg="Gagal"}dash()}
async function kick(id){if(!confirm("Keluarkan peserta ini?"))return;try{await db.doc("players/"+id).delete()}catch(e){}}
async function resetAll(){if(!confirm("Hapus SEMUA peserta dan hasilnya?"))return;for(const id of Object.keys(PL))await db.doc("players/"+id).delete().catch(()=>{});msg="Permainan direset"}
async function csv(){const d=await claude.use("downloads");if(!d){msg="Unduhan tidak tersedia";return dash()}const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
 const rows=[["Nama","Tim","Bintang","Skor","Percobaan","Penguasaan %",...LV.map(l=>l.c+" %")].map(q).join(",")];
 Object.values(PL).sort((a,b)=>ttot(b)-ttot(a)).forEach(p=>{const a=agg([p]);rows.push([p.name,p.team||"",tstars(p),ttot(p),Object.values(p.att||{}).reduce((x,y)=>x+y,0),mast(p)==null?"":mast(p),...LV.map(l=>a.L[l.c]?pct(a.L[l.c][0],a.L[l.c][1]):"")].map(q).join(","))});
 try{await d.save({filename:"hasil-misi-pid.csv",data:"\ufeff"+rows.join("\n")})}catch(e){}}
init();
